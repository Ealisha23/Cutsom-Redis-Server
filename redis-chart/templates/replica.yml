{{- if .Values.replica.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-replica
  labels:
    run: redis-replica
spec:
  replicas: {{ .Values.replica.replicas }}
  selector:
    matchLabels:
      run: redis-replica
  template:
    metadata:
      labels:
        run: redis-replica
    spec:
      containers:
        - name: redis-replica
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # one argument "<host> <port>", exactly as the CodeCrafters tests pass it
          args: ["--replicaof", "redis-service {{ .Values.service.port }}"]
          ports:
            - containerPort: {{ .Values.service.port }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-replica-service
  labels:
    run: redis-replica
spec:
  type: ClusterIP
  selector:
    run: redis-replica
  ports:
    - port: {{ .Values.service.port }}
      protocol: TCP
      targetPort: {{ .Values.service.port }}
{{- end }}
