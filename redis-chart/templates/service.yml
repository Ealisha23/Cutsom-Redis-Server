apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    run: redis
spec:
  type: {{ .Values.service.type }}
  selector:
    run: redis
  ports:
    - port: {{ .Values.service.port }}
      protocol: TCP
      targetPort: {{ .Values.service.port }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
